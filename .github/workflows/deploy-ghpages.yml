name: Deploy to GitHub pages
on:
  push:
    branches:
      - development
  release:
    types:
      - published
  workflow_dispatch:
jobs:
  build-and-deploy:
    permissions:
      contents: write # Required to deploy to GitHub Pages
      pages: write # Required to deploy to GitHub Pages
      id-token: write # Required for authentication with GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "22.14.0"
      - name: Install and Build 🔧
        run: |
          cd documentation
          npm install
          npm run docs:build
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@3.7.1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: gh-pages # The branch the action should deploy to.
          FOLDER: documentation/docs/.vuepress/dist # The folder the action should deploy.
          CLEAN: true # Automatically remove deleted files from the deploy branch
          CLEAN_EXCLUDE: '["version"]'